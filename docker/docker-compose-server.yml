# ============================================================================
# UDPspeeder Docker Compose Configuration (Host Network Mode)
# ============================================================================
# 项目: UDPspeeder-Server
# 版本: v1.1.0
# 日期: 2026-01-16
# 描述: Docker Compose 编排文件 - Host 网络模式（最大化网络性能）
# 注意: Host 模式直接使用宿主机网络，无网络隔离，性能最优
# 用法: 
#   服务端: docker-compose up -d speeder-server
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 服务端配置 (Host Network Mode)
  # ============================================================================
  speeder-server:
    image: ghcr.io/ihub-2020/udpspeeder}:latest
    container_name: udpspeeder-server
    restart: unless-stopped
    network_mode: host
    
    environment:
      # 运行模式: server
      - MODE: server
      
      # 核心权限配置
      - PUID=1000           # 运行用户 ID
      - PGID=1000           # 运行组 ID
      - UMASK=022           # 文件权限掩码
      
      # 监听地址和端口 (Host 模式直接监听宿主机端口)
      - LOCAL_ADDR: ${LOCAL_ADDR}
      - LOCAL_PORT: ${LOCAL_PORT}
      
      # 后端地址 (转发到本地服务)
      - REMOTE_ADDR: ${REMOTE_ADDR}
      - REMOTE_PORT: ${REMOTE_PORT}
      
      # FEC 参数 (格式: x:y, 每 x 个包发送 y 个冗余包)
      - FEC_PARAMS: "20:10"
      
      # 密码 (必须与客户端一致)
      - PASSWORD: "${PASSWORD}"
      
      # 工作模式: 0 = 省流量, 1 = 低延迟
      - WORK_MODE: ${WORK_MODE}
      
      # FEC 超时时间 (毫秒)
      - TIMEOUT: ${TIMEOUT}
      
      # 额外参数 (可选)
      - EXTRA_ARGS: "${EXTRA_ARGS}"
      
      # 时区设置
      - TZ: Asia/Shanghai
      
    volumes:
      # 配置目录
      - ${CONFIG_DIR}:/app/config
      
      # 日志目录
      - ${LOG_DIR}:/app:logs
    
    healthcheck:
      test: ["CMD", "/entrypoint.sh", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"