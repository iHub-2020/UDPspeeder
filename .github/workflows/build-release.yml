# ============================================================================
# UDPspeeder OpenWrt Build Workflow
# ============================================================================
# Project: UDPspeeder
# Author: iHub-2020
# Version: v2.2.0
# Date: 2026-01-17
# Description: A Tunnel which Improves your Network Quality on a High-latency 
#              Lossy Link by using Forward Error Correction (FEC).
#              Supports All Traffics (TCP/UDP/ICMP).
# Repository: https://github.com/iHub-2020/UDPspeeder
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-openwrt:
    name: Build OpenWrt (${{ matrix.arch }})
    # 修复：使用 ubuntu-latest 解决 ubuntu-20.04 排队卡顿问题
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: g++
            packages: build-essential
            
          - arch: aarch64
            cc: aarch64-linux-gnu-g++
            packages: g++-aarch64-linux-gnu
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      
      - name: Build
        run: |
          # 尝试静态编译，如果失败则回退到普通编译
          # 注意：确保 crc32/Crc32.cpp 文件名大小写与仓库实际一致
          ${{ matrix.cc }} -std=c++11 -Wall -O2 -static \
            main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp \
            packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp \
            misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp \
            -I. -isystem libev -lrt -o speederv2_${{ matrix.arch }} || \
          ${{ matrix.cc }} -std=c++11 -Wall -O2 \
            main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp \
            packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp \
            misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp \
            -I. -isystem libev -lrt -o speederv2_${{ matrix.arch }}
          
          # 验证生成的文件
          ls -lh speederv2_${{ matrix.arch }}
          file speederv2_${{ matrix.arch }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: speederv2_${{ matrix.arch }}
          path: speederv2_${{ matrix.arch }}

  release:
    needs: build-openwrt
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    # 新增：显式声明权限，确保能上传 Release
    permissions:
      contents: write
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Package
        run: |
          mkdir release
          # download-artifact v4 会将每个 artifact 下载到子目录中，需要调整路径
          # 结构通常是 artifacts/speederv2_x86_64/speederv2_x86_64
          find artifacts -type f -name "speederv2_*" -exec cp {} release/ \;
          
          cd release
          ls -lh
          sha256sum * > SHA256SUMS.txt
          tar -czf ../speederv2_binaries.tar.gz *
      
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            speederv2_binaries.tar.gz
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
