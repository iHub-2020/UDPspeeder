# ============================================================================
# UDPspeeder OpenWrt Build Workflow
# ============================================================================
# Project: UDPspeeder
# Author: iHub-2020
# Version: v2.2.0
# Date: 2026-01-17
# Description: Build OpenWrt binaries for x86_64 and aarch64
# Repository: https://github.com/iHub-2020/UDPspeeder
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-openwrt:
    name: Build OpenWrt (${{ matrix.arch }})
    runs-on: ubuntu-20.04
    
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: g++
            packages: build-essential
            
          - arch: aarch64
            cc: aarch64-linux-gnu-g++
            packages: g++-aarch64-linux-gnu
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      
      - name: Build
        run: |
          ${{ matrix.cc }} -std=c++11 -Wall -O2 -static \
            main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp \
            packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp \
            misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp \
            -I. -isystem libev -lrt -o speederv2_${{ matrix.arch }} || \
          ${{ matrix.cc }} -std=c++11 -Wall -O2 \
            main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp \
            packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp \
            misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp \
            -I. -isystem libev -lrt -o speederv2_${{ matrix.arch }}
          
          file speederv2_${{ matrix.arch }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: speederv2_${{ matrix.arch }}
          path: speederv2_${{ matrix.arch }}

  release:
    needs: build-openwrt
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Package
        run: |
          mkdir release
          cp speederv2_*/* release/
          cd release && sha256sum * > SHA256SUMS.txt
          tar -czf ../speederv2_binaries.tar.gz *
      
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            speederv2_binaries.tar.gz
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
