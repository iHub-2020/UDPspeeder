# ============================================================================
# UDPspeeder Multi-Platform Build Workflow
# ============================================================================
# Project: UDPspeeder
# Author: iHub-2020
# Version: v2.3.0
# Date: 2026-01-17
# Description: Build OpenWrt binaries for x86_64 and aarch64 platforms
# Repository: https://github.com/iHub-2020/UDPspeeder
# Changelog:
#   v2.3.0 - Auto version increment, keep only 3 latest releases
#   v2.2.0 - Simplified workflow for OpenWrt targets only
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.5)'
        required: false
        type: string

env:
  PROJECT_NAME: speederv2
  COMMON_FLAGS: >-
    -std=c++11 -Wall -Wextra -O2
    -Wno-unused-variable -Wno-unused-parameter -Wno-missing-field-initializers
  SOURCE_FILES: >-
    main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp
    packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp
    misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp

jobs:
  build-openwrt:
    name: Build OpenWrt (${{ matrix.arch }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: g++
            packages: build-essential
            
          - arch: aarch64
            cc: aarch64-linux-gnu-g++
            packages: g++-aarch64-linux-gnu
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      
      - name: Generate version header
        run: |
          echo "const char *gitversion = \"$(git rev-parse --short HEAD)\";" > git_version.h
      
      - name: Build binary
        run: |
          ${{ matrix.cc }} ${COMMON_FLAGS} -static \
            -o ${PROJECT_NAME}_${{ matrix.arch }} -I. \
            ${SOURCE_FILES} -isystem libev -lrt -lgcc_eh || \
          ${{ matrix.cc }} ${COMMON_FLAGS} -static \
            -o ${PROJECT_NAME}_${{ matrix.arch }} -I. \
            ${SOURCE_FILES} -isystem libev -lrt || \
          ${{ matrix.cc }} ${COMMON_FLAGS} \
            -o ${PROJECT_NAME}_${{ matrix.arch }} -I. \
            ${SOURCE_FILES} -isystem libev -lrt
          
          file ${PROJECT_NAME}_${{ matrix.arch }}
          ls -lh ${PROJECT_NAME}_${{ matrix.arch }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speederv2_${{ matrix.arch }}
          path: speederv2_${{ matrix.arch }}

  create-release:
    name: Create Release
    needs: build-openwrt
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            LATEST=$(git tag -l 'v*' | sort -V | tail -n1)
            if [ -z "$LATEST" ]; then
              VERSION="v1.0.0"
            else
              VERSION=$(echo $LATEST | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release
        run: |
          mkdir -p release
          find artifacts -type f -name "speederv2_*" -exec cp {} release/ \;
          chmod +x release/speederv2_*
          
          cd release
          sha256sum speederv2_* > SHA256SUMS.txt
          tar -czf ../speederv2_binaries.tar.gz *
          cd ..
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            speederv2_binaries.tar.gz
            release/speederv2_*
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup old releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const sortedReleases = releases.data
              .filter(r => r.tag_name.startsWith('v'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            if (sortedReleases.length > 3) {
              for (let i = 3; i < sortedReleases.length; i++) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: sortedReleases[i].id
                });
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${sortedReleases[i].tag_name}`
                });
                console.log(`Deleted release ${sortedReleases[i].tag_name}`);
              }
            }
