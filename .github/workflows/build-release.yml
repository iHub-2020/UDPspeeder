# ============================================================================
# UDPspeeder OpenWrt Build Workflow
# ============================================================================
# Project: UDPspeeder
# Author: iHub-2020
# Version: v2.2.0
# Date: 2026-01-17
# Description: Build static binaries for x86_64 and aarch64
# Repository: https://github.com/iHub-2020/UDPspeeder
# Changelog:
#   v2.2.0 - Simplified for OpenWrt x86_64 and aarch64 only
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_NAME: speederv2
  CXXFLAGS: -std=c++11 -Wall -Wextra -Wno-unused-variable -Wno-unused-parameter -Wno-missing-field-initializers -O2
  LDFLAGS: -lrt -static
  SOURCE_FILES: main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: ubuntu-20.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Generate Version
        run: |
          echo "const char *gitversion = \"$(git rev-parse --short HEAD)\";" > git_version.h
      
      - name: Build Binary
        run: |
          g++ ${CXXFLAGS} -o ${PROJECT_NAME}_x86_64 \
            -I. ${SOURCE_FILES} -isystem libev ${LDFLAGS} -lgcc_eh || \
          g++ ${CXXFLAGS} -o ${PROJECT_NAME}_x86_64 \
            -I. ${SOURCE_FILES} -isystem libev ${LDFLAGS}
          
          file ${PROJECT_NAME}_x86_64
          ls -lh ${PROJECT_NAME}_x86_64
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speederv2_x86_64
          path: speederv2_x86_64

  build-aarch64:
    name: Build aarch64
    runs-on: ubuntu-20.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu
      
      - name: Generate Version
        run: |
          echo "const char *gitversion = \"$(git rev-parse --short HEAD)\";" > git_version.h
      
      - name: Build Binary
        run: |
          aarch64-linux-gnu-g++ ${CXXFLAGS} -o ${PROJECT_NAME}_aarch64 \
            -I. ${SOURCE_FILES} -isystem libev ${LDFLAGS} -lgcc_eh || \
          aarch64-linux-gnu-g++ ${CXXFLAGS} -o ${PROJECT_NAME}_aarch64 \
            -I. ${SOURCE_FILES} -isystem libev ${LDFLAGS}
          
          file ${PROJECT_NAME}_aarch64
          ls -lh ${PROJECT_NAME}_aarch64
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speederv2_aarch64
          path: speederv2_aarch64

  release:
    name: Create Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare Release
        run: |
          mkdir -p release
          find artifacts -type f -name "speederv2_*" -exec cp {} release/ \;
          chmod +x release/speederv2_*
          
          cd release
          sha256sum speederv2_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          tar -czf ../speederv2_binaries.tar.gz *
          cd ..
          
          ls -lh release/
          ls -lh speederv2_binaries.tar.gz
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            speederv2_binaries.tar.gz
            release/speederv2_*
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
