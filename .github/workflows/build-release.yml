# ============================================================================
# UDPspeeder OpenWrt Build Workflow [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
# ============================================================================
# Project: UDPspeeder
# Author: iHub-2020 [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
# Version: v2.2.0
# Date: 2026-01-17
# Description: Build OpenWrt binaries for x86_64 and aarch64
# Repository: https://github.com/iHub-2020/UDPspeeder [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-openwrt:
    name: Build OpenWrt (${{ matrix.arch }}) [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
    # 优化：使用 ubuntu-latest 以获得更快的调度速度，解决 pickup 卡顿
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: g++
            packages: build-essential [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
            
          - arch: aarch64
            cc: aarch64-linux-gnu-g++
            packages: g++-aarch64-linux-gnu [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
      
      - name: Build
        run: |
          # 修复说明：
          # 1. 添加 libev/ev.c : 解决链接时 "undefined reference" 错误 [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
          # 2. 使用 crc32/*.cpp : 自动匹配文件名 (通常是 crc32.cpp) [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
          # 3. 添加 -lpthread : 确保线程库链接正确 [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
          
          # 尝试静态编译
          ${{ matrix.cc }} -std=c++11 -Wall -O2 -static \
            main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/*.cpp \
            packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp \
            misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp libev/ev.c \
            -I. -isystem libev -lrt -lpthread -o speederv2_${{ matrix.arch }} || \ [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
          # 如果静态编译失败，尝试动态编译
          ${{ matrix.cc }} -std=c++11 -Wall -O2 \
            main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/*.cpp \
            packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp \
            misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp libev/ev.c \
            -I. -isystem libev -lrt -lpthread -o speederv2_${{ matrix.arch }} [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)
          
          # 检查生成结果
          ls -lh speederv2_${{ matrix.arch }}
          file speederv2_${{ matrix.arch }} [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
      
      - uses: actions/upload-artifact@v4
        with:
          name: speederv2_${{ matrix.arch }}
          path: speederv2_${{ matrix.arch }} [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)

  release:
    needs: build-openwrt
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
      
      - name: Package
        run: |
          mkdir release [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
          # 查找并复制所有构建产物
          find artifacts -type f -name "speederv2_*" -exec cp {} release/ \; [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
          
          cd release
          ls -lh
          sha256sum * > SHA256SUMS.txt
          tar -czf ../speederv2_binaries.tar.gz * [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)
      
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            speederv2_binaries.tar.gz
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
``` [[1]](https://stackoverflow.com/questions/7654386/how-do-i-properly-escape-data-for-a-makefile)[[2]](https://github.com/wangyu-/UDPspeeder/wiki/ipv6-and-domain)

